<style>
  .exp-panel { margin-bottom: 1rem; padding: 1rem; background: #ffffff; border: 1px solid #e2e8f0; border-radius: .5rem; }
  .exp-panel h3 { margin: 0 0 .75rem; font-size: .95rem; font-weight: 600; color: #0f172a; }
  .exp-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .75rem; }
  .exp-form label { display: block; margin-bottom: .3rem; font-size: .75rem; font-weight: 500; color: #0f172a; }
  .exp-form select, .exp-form input {
    min-width: 11rem; padding: .5rem .75rem; font-size: .875rem; color: #334155;
    background: #ffffff; border: 1px solid #cbd5e1; border-radius: .375rem;
  }
  .exp-form select:focus, .exp-form input:focus { outline: none; border-color: #2A55A8; box-shadow: 0 0 0 2px #B9D1E8; }
  .exp-form option { color: #111827; background: #ffffff; }
  .exp-form button {
    padding: .55rem 1.1rem; font-size: .875rem; font-weight: 600; color: #fff; cursor: pointer;
    background: #2A55A8; border: 0; border-radius: .375rem;
  }
  .exp-form button:hover { background: #234A9A; }
  .exp-note { margin: .6rem 0 0; font-size: .75rem; color: #64748b; }
</style>

<div class="exp-panel">
  <h3>Export Excel (Daftar Isi Berkas)</h3>
  <form method="get" action="{% url 'arsip_export' %}" class="exp-form">
    <div>
      <label for="exp-bagian">Bagian</label>
      <select name="bagian" id="exp-bagian" onchange="document.getElementById('exp-susunan-box').style.display = this.value === 'semua' ? '' : 'none'">
        <option value="semua">Semua bagian</option>
        {% for u in export_units %}<option value="{{ u.pk }}">{{ u.nama }}</option>{% endfor %}
      </select>
    </div>
    <div id="exp-susunan-box">
      <label for="exp-susunan">Susunan semua bagian</label>
      <select name="susunan" id="exp-susunan">
        <option value="gabung">Digabung jadi satu daftar</option>
        <option value="terpisah">Dipisah per bagian</option>
      </select>
    </div>
    <div>
      <label for="exp-dari">Dari bulan</label>
      <input type="month" name="dari" id="exp-dari" value="{{ export_dari }}">
    </div>
    <div>
      <label for="exp-sampai">Sampai bulan</label>
      <input type="month" name="sampai" id="exp-sampai" value="{{ export_sampai }}">
    </div>
    <div>
      <label for="exp-mode">Format</label>
      <select name="mode" id="exp-mode">
        <option value="per_bulan">Satu tab per bulan</option>
        <option value="gabung">Semua bulan dalam satu tab</option>
      </select>
    </div>
    <button type="submit">Export Excel</button>
  </form>
  <p class="exp-note">Isi file tidak terpengaruh filter dan pencarian di bawah, hanya pilihan di kotak ini.</p>
</div>
{% include "admin/arsip/import_panel.html" %}
