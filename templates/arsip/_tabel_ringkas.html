<div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
  <table class="min-w-full text-left text-sm">
    <thead class="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500">
      <tr>
        <th class="px-4 py-3">Kode</th>
        <th class="px-4 py-3">Uraian informasi</th>
        <th class="px-4 py-3">Tanggal</th>
        <th class="px-4 py-3">Jumlah</th>
        <th class="px-4 py-3">Ket.</th>
        <th class="px-4 py-3">Keamanan</th>
        <th class="px-4 py-3 text-right">Aksi</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      {% for a in arsip %}
      <tr class="hover:bg-blue-50/40">
        <td class="whitespace-nowrap px-4 py-3 font-semibold text-blue-700">{{ a.kode_klasifikasi }}</td>
        <td class="max-w-md px-4 py-3 text-slate-700">{{ a.uraian }}</td>
        <td class="whitespace-nowrap px-4 py-3">{{ a.tanggal|date:"d M Y" }}</td>
        <td class="whitespace-nowrap px-4 py-3">{{ a.jumlah_tampil }}</td>
        <td class="px-4 py-3">{{ a.get_keterangan_display }}</td>
        <td class="px-4 py-3">
          <span class="whitespace-nowrap rounded-full px-2.5 py-1 text-xs font-medium {% if a.keamanan == 'rahasia' %}bg-red-50 text-red-700{% elif a.keamanan == 'terbatas' %}bg-amber-50 text-amber-700{% else %}bg-emerald-50 text-emerald-700{% endif %}">{{ a.get_keamanan_display }}</span>
        </td>
        <td class="whitespace-nowrap px-4 py-3 text-right">
          <a href="{% url 'arsip_ubah' a.pk %}" class="font-medium text-blue-600 hover:underline">Ubah</a>
          <form method="post" action="{% url 'arsip_hapus' a.pk %}" class="ml-3 inline" onsubmit="return confirm('Hapus arsip ini?')">
            {% csrf_token %}
            <button class="font-medium text-red-600 hover:underline">Hapus</button>
          </form>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="7" class="px-4 py-12 text-center text-slate-400">Belum ada arsip.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
